<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Forecast · Lappeenranta</title>
  <style>
    :root {
      --bg: #0f1724;
      --card: #16213a;
      --accent: #4ea8de;
      --text: #e6edf3;
      --muted: #9aa7b5;
      --border: #27324a;
      --row-alt: #1b2740;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #0b1220 0%, #0f1724 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
    }

    header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.9rem;
      font-weight: 600;
    }

    header .subtitle {
      color: var(--muted);
      margin: 0 0 1.5rem;
      font-size: 0.95rem;
    }

    .image-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      padding: 1rem;
    }

    .forecast-image {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      background: #101a30;
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 1.5rem;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: #16a34a;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      padding: 0.9rem 1.8rem;
      border-radius: 12px;
      border: 1px solid #22c55e;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.35);
      transition: background 0.15s ease, transform 0.05s ease;
    }

    .download-btn:hover { background: #22c55e; }
    .download-btn:active { transform: translateY(1px); }

    .download-btn svg {
      width: 1.3rem;
      height: 1.3rem;
    }

    footer {
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Weather Forecast · Lappeenranta</h1>
      <p class="subtitle">Temperature forecast animation · South Karelia, Finland</p>
    </header>

    <div class="image-panel">
      <img
        class="forecast-image"
        src="T2M_20260101_300_150_grid.gif"
        alt="Temperature forecast animation for Lappeenranta"
      />
    </div>

    <div class="actions">
      <a class="download-btn" href="T2M_20260101_300_150_grid.gif" download="T2M_20260101_300_150_grid.gif">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12" />
          <path d="M7 10l5 5 5-5" />
          <path d="M5 21h14" />
        </svg>
        Download GIF
      </a>
    </div>

    <footer>
      Animated forecast · Twinverse Weather Demo
    </footer>
  </div>
</body>
</html>
